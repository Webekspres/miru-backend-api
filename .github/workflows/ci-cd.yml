name: Backend CI/CD Pipeline

on:
  push:
    branches:
      - staging
      - main
  pull_request:
    branches:
      - staging
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ==========================================
  # 1. CI: Run Tests & Code Quality Check
  # ==========================================
  test:
    name: Run Backend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django System Check
        run: |
          python manage.py check

      - name: Run Test Suite
        env:
          USE_POSTGRES: 'False'
          SECRET_KEY: 'ci-test-secret-key-not-for-production'
          DEBUG: 'True'
        run: |
          python run_all_tests.py

  # ==========================================
  # 2. CD: Build Docker Image & Push to GHCR
  # ==========================================
  build-and-push:
    name: Build & Push Image to GHCR
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      env_name: ${{ steps.set-env.outputs.env_name }}
      target_dir: ${{ steps.set-env.outputs.target_dir }}
      image_tag: ${{ steps.set-env.outputs.image_tag }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Determine Environment
        id: set-env
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "env_name=production" >> $GITHUB_OUTPUT
            echo "target_dir=/opt/miru-prod" >> $GITHUB_OUTPUT
            echo "image_tag=latest" >> $GITHUB_OUTPUT
          else
            echo "env_name=staging" >> $GITHUB_OUTPUT
            echo "target_dir=/opt/miru-staging" >> $GITHUB_OUTPUT
            echo "image_tag=staging" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.set-env.outputs.image_tag }}
            type=sha,prefix=${{ steps.set-env.outputs.env_name }}-,format=short

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================================
  # 3. CD: Deploy to VPS via SSH
  # ==========================================
  deploy:
    name: Deploy to VPS
    needs: build-and-push
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: ${{ needs.build-and-push.outputs.env_name }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Sync staging stack files to VPS
        if: needs.build-and-push.outputs.env_name == 'staging'
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT || 22022 }}
          username: ${{ secrets.SSH_USER || 'developer' }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: deploy/staging/docker-compose.yml,deploy/staging/nginx.conf
          target: /opt/miru-staging
          strip_components: 2

      - name: Execute Remote Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT || 22022 }}
          username: ${{ secrets.SSH_USER || 'developer' }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            echo "==> Logging in to GHCR on server..."
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin || true
            echo "==> Deploying Backend to ${{ needs.build-and-push.outputs.env_name }} at ${{ needs.build-and-push.outputs.target_dir }}..."
            cd ${{ needs.build-and-push.outputs.target_dir }}

            if [ "${{ needs.build-and-push.outputs.env_name }}" = "staging" ]; then
              echo "==> Ensuring MinIO credentials in .env..."
              touch .env
              grep -q '^MINIO_ROOT_USER=' .env || echo 'MINIO_ROOT_USER=miru_staging' >> .env
              grep -q '^MINIO_ROOT_PASSWORD=' .env || echo "MINIO_ROOT_PASSWORD=$(openssl rand -hex 16)" >> .env
              grep -q '^MINIO_ACCESS_KEY=' .env || echo 'MINIO_ACCESS_KEY=miru_staging' >> .env
              grep -q '^MINIO_SECRET_KEY=' .env || echo "MINIO_SECRET_KEY=$(grep '^MINIO_ROOT_PASSWORD=' .env | cut -d= -f2-)" >> .env
              grep -q '^MINIO_BUCKET=' .env || echo 'MINIO_BUCKET=mirubanksampah' >> .env
              grep -q '^MINIO_REGION=' .env || echo 'MINIO_REGION=us-east-1' >> .env

              echo "==> Pull images and start full staging stack (db, minio, api, admin, nginx)..."
              docker compose pull api admin
              docker compose up -d

              echo "==> Waiting for MinIO to become healthy..."
              for i in $(seq 1 30); do
                if docker compose ps minio | grep -q '(healthy)'; then
                  echo "MinIO is healthy."
                  break
                fi
                if [ "$i" -eq 30 ]; then
                  echo "ERROR: MinIO failed to become healthy."
                  docker compose ps
                  docker compose logs minio --tail 50
                  exit 1
                fi
                sleep 2
              done
            else
              docker compose pull api
              docker compose up -d --no-deps api
            fi

            echo "==> Running database migrations..."
            docker compose exec -T api python manage.py migrate --noinput

            if [ "${{ needs.build-and-push.outputs.env_name }}" = "staging" ]; then
              echo "==> Verifying MinIO from Django..."
              docker compose exec -T api python manage.py shell -c "
            from django.conf import settings
            from api.services.object_storage import ensure_bucket
            assert settings.MINIO_ENABLED, 'MINIO_ENABLED is False'
            ensure_bucket()
            print('MinIO OK:', settings.MINIO_ENDPOINT, settings.MINIO_BUCKET)
            "
              docker compose ps minio api
            else
              docker compose ps api
            fi

            echo "==> Backend Deployment completed successfully!"
